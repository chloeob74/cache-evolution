max_iterations: 50

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENAI_API_KEY}"
  primary_model: "qwen/qwen3.6-plus-preview:free"
  temperature: 0.7
  max_tokens: 4096

prompt:
  path: "prompt.txt"

evaluator:
  timeout: 120
  cascade_evaluation: false

database:
  population_size: 100
  num_islands: 3
  log_prompts: true
  db_path: "./openevolve_db"
  in_memory: false
