max_iterations: 50

llm:
  api_base: "https://api.anthropic.com/v1/"
  api_key: "${ANTHROPIC_API_KEY}"
  primary_model: "claude-sonnet-4-6"
  temperature: 0.7
  max_tokens: 4096

prompt:
  path: "prompt.txt"

evaluator:
  timeout: 45
  cascade_evaluation: false

database:
  population_size: 100
  num_islands: 3
  log_prompts: true
  db_path: "./openevolve_db"
  in_memory: false
